name: Windows Build

on:
  pull_request:
    branches:
      - Feature
      - Master
      - Develop
      - HotFix
      - Integration
      - Release

  push:
    branches:
      - Feature
      - Master
      - Develop
      - HotFix
      - Integration
      - Release

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: MSBuild x64 ${{ matrix.configuration }}
    runs-on: windows-2025-vs2026
    timeout-minutes: 20

    permissions:
      contents: read
      pull-requests: write

    strategy:
      fail-fast: false
      matrix:
        configuration:
          - Debug
          - Release

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Test failure reporter
        if: matrix.configuration == 'Debug'
        shell: pwsh
        run: python -m unittest discover -s .github/scripts -p test_report_ci_failure.py

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: x64
          vs-version: '[18.0,19.0)'

      - name: Build solution
        shell: pwsh
        run: >
          msbuild DX12PROJECT.slnx
          /m
          /t:Build
          /p:Configuration=${{ matrix.configuration }}
          /p:Platform=x64
          /verbosity:minimal
          "/flp:logfile=msbuild.log;verbosity=normal"
          /bl:msbuild.binlog
          /nologo

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: msbuild-x64-${{ matrix.configuration }}
          path: |
            msbuild.log
            msbuild.binlog
          if-no-files-found: warn
          retention-days: 7

      - name: Report CI failure to PR
        if: failure() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPORT_JOB_STATUS: ${{ job.status }}
          REPORT_CHECK: MSBuild
          REPORT_CONFIGURATION: ${{ matrix.configuration }}
          REPORT_LOG: msbuild.log
        run: python .github/scripts/report_ci_failure.py

  static-analysis:
    name: MSVC Analysis x64 ${{ matrix.configuration }}
    runs-on: windows-2025-vs2026
    timeout-minutes: 20

    permissions:
      contents: read
      pull-requests: write

    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: x64
          vs-version: '[18.0,19.0)'

      - name: Run MSVC code analysis
        shell: pwsh
        env:
          CL: /analyze /analyze:external-
        run: >
          msbuild DX12PROJECT.slnx
          /m
          /t:Rebuild
          /p:Configuration=${{ matrix.configuration }}
          /p:Platform=x64
          /p:RunCodeAnalysis=true
          /p:EnableMicrosoftCodeAnalysis=true
          /verbosity:normal
          "/flp:logfile=msvc-analysis.log;verbosity=normal"
          /bl:msvc-analysis.binlog
          /nologo

      - name: Upload analysis diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: msvc-analysis-x64-${{ matrix.configuration }}
          path: |
            msvc-analysis.log
            msvc-analysis.binlog
          if-no-files-found: warn
          retention-days: 7

      - name: Report CI failure to PR
        if: failure() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPORT_JOB_STATUS: ${{ job.status }}
          REPORT_CHECK: MSVC Analysis
          REPORT_CONFIGURATION: ${{ matrix.configuration }}
          REPORT_LOG: msvc-analysis.log
        run: python .github/scripts/report_ci_failure.py

  clang-tidy:
    name: clang-tidy x64 ${{ matrix.configuration }}
    runs-on: windows-2025-vs2026
    timeout-minutes: 20

    permissions:
      contents: read
      pull-requests: write

    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: x64
          vs-version: '[18.0,19.0)'

      - name: Run clang-tidy
        shell: pwsh
        run: >
          msbuild DX12PROJECT.slnx
          /m
          /t:Rebuild
          /p:Configuration=${{ matrix.configuration }}
          /p:Platform=x64
          /p:RunCodeAnalysis=true
          /p:EnableMicrosoftCodeAnalysis=false
          /p:EnableClangTidyCodeAnalysis=true
          /verbosity:normal
          "/flp:logfile=clang-tidy.log;verbosity=normal"
          /bl:clang-tidy.binlog
          /nologo

      - name: Upload clang-tidy diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: clang-tidy-x64-${{ matrix.configuration }}
          path: |
            clang-tidy.log
            clang-tidy.binlog
            GameEngine/Default/**/GameEngine.ClangTidy.log
            GameLauncher/Default/**/GameLauncher.ClangTidy.log
          if-no-files-found: warn
          retention-days: 7

      - name: Report CI failure to PR
        if: failure() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPORT_JOB_STATUS: ${{ job.status }}
          REPORT_CHECK: clang-tidy
          REPORT_CONFIGURATION: ${{ matrix.configuration }}
          REPORT_LOG: clang-tidy.log
        run: python .github/scripts/report_ci_failure.py

